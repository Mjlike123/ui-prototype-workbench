$schema: "https://json-schema.org/draft/2020-12/schema"
title: RequirementBrief
type: object
additionalProperties: true
required: [schemaVersion, feature, sources, pages, flows]
properties:
  schemaVersion:
    type: integer
    const: 1
  feature:
    type: object
    required: [id, name]
    properties:
      id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      name: { type: string }
      platform:
        enum: [ios, android, web, desktop, cross-platform, other]
      viewport:
        type: object
        properties:
          width: { type: integer, minimum: 1 }
          height: { type: integer, minimum: 1 }
      goals:
        type: array
        items: { type: string }
      personas:
        type: array
        items: { type: string }
  sources:
    type: array
    minItems: 1
    items:
      type: object
      required: [type, ref]
      properties:
        type: { type: string }
        ref: { type: string }
        extractedAt: { type: string }
        confidence:
          enum: [high, medium, low]
  scope:
    type: object
    properties:
      newBehavior:
        type: array
        items: { type: string }
      existingModified:
        type: array
        items: { type: string }
      existingUnchanged:
        type: array
        items:
          type: object
          required: [item, evidence]
          properties:
            item: { type: string }
            evidence: { type: string }
      uncertain:
        type: array
        items: { type: string }
  visualDirections:
    type: array
    items:
      type: object
      required: [statement, sourceRef]
      properties:
        statement: { type: string }
        sourceRef: { type: string }
        confidence:
          enum: [high, medium, low]
  qualityBar:
    type: object
    description: Observable quality target for new pages, redesigns, and material visual changes.
    properties:
      category: { type: string }
      primaryTask: { type: string }
      firstScreenHero: { type: string }
      designSpecificity: { type: string }
      signatureMoment: { type: string }
      benchmarkPatterns:
        type: array
        items:
          type: object
          required: [sourceRef, observedPattern, decision]
          properties:
            sourceRef: { type: string }
            observedPattern: { type: string }
            decision:
              enum: [adopt, avoid, needs-validation]
      contentRequirements:
        type: array
        items: { type: string }
      acceptance:
        type: array
        items: { type: string }
  designImpacts:
    type: array
    items:
      type: object
      required: [sourceType, statement, impact, target]
      properties:
        sourceType: { type: string }
        sourceRef: { type: string }
        statement: { type: string }
        impact: { type: string }
        target:
          enum: [interaction, visual, both]
        confidence:
          enum: [high, medium, low]
  ignoredItems:
    type: array
    items:
      type: object
      required: [item, reason, sourceRef]
      properties:
        item: { type: string }
        reason: { type: string }
        sourceRef: { type: string }
  pages:
    type: array
    items:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        knownStates:
          type: array
          items: { type: string }
        sourceRefs:
          type: array
          items: { type: string }
  flows:
    type: array
    items:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        type:
          enum: [primary, secondary, error, cancel]
        steps:
          type: array
          items: { type: string }
  rules:
    type: array
    items:
      type: object
      required: [text, source]
      properties:
        text: { type: string }
        source: { type: string }
        confidence:
          enum: [high, medium, low]
  visualReferences:
    type: array
    items: { type: object }
  competitiveInsights:
    type: object
  conflicts:
    type: array
    items: { type: object }
  openQuestions:
    type: array
    items: { type: string }
