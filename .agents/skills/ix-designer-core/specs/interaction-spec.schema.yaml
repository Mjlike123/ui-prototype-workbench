$schema: "https://json-schema.org/draft/2020-12/schema"
title: InteractionSpec
type: object
additionalProperties: true
required: [schemaVersion, featureId, pages]
properties:
  schemaVersion:
    type: integer
    const: 1
  featureId: { type: string }
  platform:
    enum: [ios, android, web, desktop, cross-platform, other]
  pages:
    type: array
    items:
      type: object
      required: [id, name, purpose, states]
      properties:
        id: { type: string }
        name: { type: string }
        purpose: { type: string }
        entry:
          type: array
          items: { type: string }
        exit:
          type: array
          items: { type: string }
        terminal: { type: boolean }
        states:
          type: array
          items:
            type: object
            required: [id, description]
            properties:
              id: { type: string }
              description: { type: string }
              conditions: { type: string }
        elements:
          type: array
          items:
            type: object
            required: [id, role]
            properties:
              id: { type: string }
              role: { type: string }
              label: { type: string }
              behavior: { type: string }
        transitions:
          type: array
          items:
            type: object
            required: [trigger, result]
            properties:
              fromStateId: { type: string }
              trigger: { type: string }
              result: { type: string }
              toStateId: { type: string }
              targetPageId: { type: string }
              targetOverlayId: { type: string }
              feedback: { type: string }
              duration: { type: string }
              notes: { type: string }
  overlays:
    type: array
    items:
      type: object
      required: [id, name, hostPageId, dismiss]
      properties:
        id: { type: string }
        name: { type: string }
        hostPageId: { type: string }
        type: { type: string }
        dismiss:
          type: array
          items: { type: string }
        states:
          type: array
          items: { type: object }
  globalRules:
    type: array
    items: { type: string }
  designSystemMapping:
    type: array
    items:
      type: object
      required: [pageId, region, source]
      properties:
        pageId: { type: string }
        region: { type: string }
        assetId: { type: string }
        source:
          enum: [page, module, component, pattern, token, primitive, prototype]
        sourceRef: { type: string }
        gapType:
          enum: [pageGap, componentGap, interactionGap, tokenGap, contentGap, capabilityGap]
        gap: { type: string }
        notes: { type: string }
        candidate:
          type: object
          required: [id, kind, intent, recommendation]
          properties:
            id: { type: string }
            kind:
              enum: [component, pattern, token, content, capability]
            intent: { type: string }
            recommendation:
              enum: [keep-prototype, nominate, reject]
            reuseEvidence:
              type: array
              items: { type: string }
            validation:
              type: array
              items: { type: string }
            blockers:
              type: array
              items: { type: string }
  kitMapping:
    type: array
    description: Compatibility alias for existing profiles; new profiles should use designSystemMapping.
    items: { type: object }
  optimizations:
    type: array
    items:
      type: object
      properties:
        type:
          enum: [design-completion, ux-improvement, needs-product-confirm]
        topic: { type: string }
        original: { type: string }
        proposal: { type: string }
        evidence: { type: string }
