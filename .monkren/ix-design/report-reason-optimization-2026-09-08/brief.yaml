schemaVersion: 1
feature:
  id: report-reason-optimization
  name: 用户举报页面举报原因优化
  platform: web
  viewport:
    width: 375
    height: 812
  goals:
    - 补齐骚扰、隐私安全、暴力恐怖及政治宗教违规等系统举报出口
    - 让用户准确理解资料类举报将自动提交哪些资料作为案件证据
    - 保持新版 H5 举报流程一致，降低用户转向人工反馈的比例
  personas:
    - 在语音房遭遇跟踪、挑衅或其他骚扰，需要通过系统举报的用户
    - 举报个人资料或房间资料违规、需要理解证据提交范围的用户
    - 负责接收系统举报并减少人工反馈压力的运营与审核人员

