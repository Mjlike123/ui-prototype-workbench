    linkedPageId: profile-report-form

competitiveInsights:
  competitors:
    - TikTok
    - Instagram
    - Discord
  adopt:
    - 从具体违规对象附近进入举报并持续明确当前对象
    - 使用用户可理解的原因名称，不暴露审核后台枚举
    - 将具体原因和证据放在原因选择之后，并在失败时保留上下文
  avoid:
    - 为本期新增多级原因分类而增加步骤
    - 复制竞品视觉或承诺未定义的审核时长和处罚结果
    - 把所有高风险问题压缩到 Other
  researchReport: .monkren/ix-design/report-reason-optimization-2026-09-08/research.md

conflicts:
  - topic: Harassment 正式英文拼写
    sources:
      - 当前 PRD 选项写为 Harrassment
      - 英文标准拼写为 Harassment，背景法语为 harcèlement
    resolution: 用户于 2026-09-08 确认使用正确拼写 Harassment
  - topic: Other 输入与现有 Violation Description 的关系
    sources:
      - 当前 PRD 要求选择 Other 后展示最多 100 字输入框
      - V3.15.0 已有最多 200 字的可选 Violation Description
    resolution: 用户于 2026-09-08 确认为独立字段，选择 Other 时必填且最多 100 字
  - topic: 原因集合的场景范围
    sources:
      - 当前 PRD 表述为新版 H5 举报页面调整且上线 All region
      - Under age user 明确仅 FR 区保持原逻辑
    resolution: 用户于 2026-09-08 确认所有新版 H5 举报场景统一集合与顺序，仅 Under age user 按 FR 条件展示

openQuestions:
  - 提交成功后的现有落点和成功反馈是什么？原型默认沿用当前 H5 行为，不新增结果页。
