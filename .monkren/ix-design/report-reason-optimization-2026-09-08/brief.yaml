    reason: no-user-facing-impact
    sourceRef: PRD 多语言及后台 reason 规则
  - item: 各地区进入 110 或 dashboard report management 的审核路由
    reason: existing-unchanged
    sourceRef: V3.15.0 历史文档
  - item: CS 内部员工举证通道
    reason: out-of-release-scope
    sourceRef: V3.15.0 历史文档
  - item: 重新设计证据上传数量、格式、大小和上传时机
    reason: existing-unchanged
    sourceRef: V3.15.0 历史文档
  - item: PRD 截图中的 DBG 浮层、水印和非产品标注
    reason: no-user-facing-impact
    sourceRef: PRD 内嵌截图

pages:
  - id: report-reason-form
    name: 通用举报原因页
    description: 复用新版 H5 举报表单，只调整举报原因集合、名称与 Other 条件输入
    knownStates:
      - 未选择原因、Submit 禁用
      - 已选择普通原因、Submit 可用
      - 选择 Other、具体原因输入展开
      - Other 输入 0 至 100 字
      - Other 输入达到上限
      - 提交中
      - 提交成功
      - 提交失败并可重试
      - 文件校验失败（存量）
    sourceRefs:
      - 当前 PRD 需求详情
      - V3.15.0 历史文档
      - .monkren/ix-design/report-reason-optimization-2026-09-08/report-reasons-source.png
  - id: profile-report-form
    name: 个人资料举报页
    description: 复用资料类型多选和通用原因页，新增个人资料自动取证说明
    knownStates:
      - 未选择资料类型和原因
      - 已选择一个或多个资料类型
      - 证据范围提示
      - 原因与 Other 条件输入状态
      - Submit 禁用或可用
    sourceRefs:
      - 当前 PRD 资料类新增提示
      - V3.15.0 历史文档资料类举报
      - .monkren/ix-design/report-reason-optimization-2026-09-08/report-profile-source.png
  - id: room-profile-report-form
    name: 房间资料举报页
    description: 复用房间资料类型多选和通用原因页，新增房间资料自动取证说明
    knownStates:
      - 未选择资料类型和原因
      - 已选择一个或多个资料类型
      - 证据范围提示
      - 原因与 Other 条件输入状态
      - Submit 禁用或可用
    sourceRefs:
      - 当前 PRD 资料类新增提示
      - V3.15.0 历史文档资料类举报

flows:
  - name: 提交普通原因举报
    type: primary
    steps:
      - 用户从现有举报入口进入新版 H5 举报页
      - 页面明确展示被举报用户或房间
      - 用户选择一个举报原因
      - 如为资料类举报，用户先选择一个或多个资料类型并看到自动取证提示
      - 用户按需填写违规描述或上传证据
      - 必填项满足后 Submit 可用
      - 用户提交并看到进度
      - 提交成功后退出举报任务并反馈成功
  - name: 提交 Other 具体原因
    type: secondary
    steps:
      - 用户选择 Other
      - 页面就近展开具体违规原因输入框并聚焦
      - 用户输入不超过 100 字的具体原因
      - 提交时前端传递具体内容，后台按 other-%AA 记录
  - name: 取消举报
    type: cancel
    steps:
      - 用户点击 Cancel 或导航返回
      - 无已填内容时直接退出
      - 有已填描述、Other 内容或已选证据时按既有离开策略处理
  - name: 提交失败恢复
    type: error
    steps:
      - 用户点击 Submit
      - 上传或提交失败
      - 页面保留原因、文字和已选择的本地证据
      - 通过 TopTop 反馈组件说明失败原因并提供重试

rules:
  - text: 举报原因单选且必填；未选择时 Submit 禁用
    source: V3.15.0 历史文档“Choose reason：为必选，原逻辑”
    confidence: high
  - text: Other 具体原因最多 100 字，超过后不能继续输入
    source: 当前 PRD Other 规则
    confidence: high
  - text: Under age user 仅在 FR 区展示，其他地区不显示
    source: 当前 PRD“当前仅 FR 区有此选项，保持原逻辑”
    confidence: high
  - text: 个人资料自动取证范围为头像、昵称、签名和个人主页背景
    source: 当前 PRD 个人资料页文案
    confidence: high
  - text: 房间资料自动取证范围为封面、名称和公告
    source: 当前 PRD 房间资料页文案
    confidence: high
  - text: 前端使用多语言展示原因，审核后台暂只接收英语原因
    source: 当前 PRD 多语言说明
    confidence: high
  - text: 资料类型保持必选、可多选，仅上报用户选择的对应资料
    source: V3.15.0 历史文档资料类举报
    confidence: high
  - text: 违规描述和证据上传保持可选，提交时才进入文件上传过程
    source: V3.15.0 历史文档用户举证流程
    confidence: high

