scope:
  newBehavior:
    - 举报原因新增 Harrassment、Privacy & Safety、Violence / gore / terrorism、Political / religious violations
    - 选择 Other 后展示具体违规原因输入框，最多输入 100 字符
    - 个人资料举报页增加自动提交头像、昵称、签名、个人主页背景作为判断证据的提示
    - 房间资料举报页增加自动提交封面、名称、公告作为判断证据的提示
  existingModified:
    - Porn/soft porn 更名为 Pornography
    - Advertising 更名为 Advertising / Diversion
    - Pretend to be official 更名为 Impersonation
    - 原有举报原因列表扩展为更长列表，需要保持原因单选、列表滚动和底部操作可用
    - Other 的后台 reason 值改为 other-%AA，其中 %AA 为用户输入内容
  existingUnchanged:
    - item: 举报对象名称显示在原因选择区上方
      evidence: V3.15.0 历史文档与当前 H5 截图均已有“You are about to report”对象提示
    - item: 举报原因保持必选单选
      evidence: V3.15.0 历史文档“Choose reason：原因选择，为必选，原逻辑”
    - item: 违规描述输入与图片、视频证据上传
      evidence: V3.15.0 历史文档已定义最多 200 字描述、4 个文件、大小校验和提交时上传
    - item: Cancel 与 Submit 操作及必填未满足时 Submit 禁用
      evidence: V3.15.0 历史文档与当前 H5 截图
    - item: 个人资料类型与房间资料类型保持必选、可多选
      evidence: V3.15.0 历史文档资料类举报章节
    - item: Under age user 只在 FR 区展示
      evidence: 当前 PRD 明确“保持原逻辑”
  uncertain: []

visualDirections:
  - statement: UI 必须沿用 TopTop H5 与 Kit 的默认颜色、字体、间距、单选、输入、按钮和反馈规范
    sourceRef: 用户要求“严格按照平台组件和 UI 规范搭建”
    confidence: high
  - statement: Report 资料页采用 50px 类型标题区、40px 原因标题区、60px 选择行、4px 分区隔断与底部 16px 滚动渐隐
    sourceRef: Figma v3.21.0 node 26:4454
    confidence: high
  - statement: 资料证据提示作为辅助说明，不应抢占必填问题标题和举报对象的视觉优先级
    sourceRef: 当前 PRD“增加一句提示”
    confidence: high
  - statement: 长原因名称必须支持本地化后的自然换行，不缩小字号、不横向滚动
    sourceRef: All region 上线范围与 TopTop 包容开放原则
    confidence: medium

designImpacts:
  - sourceType: operation
    sourceRef: PRD 背景
    statement: 用户因缺少骚扰原因而放弃系统举报，转向人工渠道
    impact: 原因列表需要使用可快速扫描的清晰标签，并确保 Harassment 在首屏高优先级位置可见
    target: both
    confidence: high
  - sourceType: product
    sourceRef: PRD 需求详情
    statement: 新增和改名后原因数量显著增加
    impact: 顶部导航和底部操作固定，原因及补充内容在独立滚动区中完整可达
    target: interaction
    confidence: high
  - sourceType: technical
    sourceRef: PRD Other 后台规则
    statement: 后台 reason 需要展示 other-%AA
    impact: 提交前保留并校验 Other 输入；UI 不直接展示后台拼接格式
    target: interaction
    confidence: high
  - sourceType: operation
    sourceRef: PRD 多语言说明
    statement: C 端 H5 使用多语言，后台原因仅推送英语
    impact: 原型验证长文案布局；前端展示文案与后台枚举值分离，不把英语枚举直接当多语言 UI 文案
    target: both
    confidence: high
  - sourceType: product
    sourceRef: PRD 资料类提示
    statement: 系统会自动提交对应个人或房间资料作为案件证据
    impact: 在资料类型选择区与原因选择区之间增加上下文提示，明确证据范围但不新增确认步骤
    target: both
    confidence: high
  - sourceType: technical
    sourceRef: V3.15.0 历史文档
    statement: 提交后才上传已选图片或视频，可能出现上传进度和文件错误
    impact: 作为存量状态在原型中保留提交中、文件过大和失败重试反馈，不重新设计上传器
    target: interaction
    confidence: high

