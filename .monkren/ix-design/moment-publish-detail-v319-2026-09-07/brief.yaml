  - item: 旧版本兼容空章节
    reason: out-of-release-scope
    sourceRef: PRD 旧版本兼容

pages:
  - id: moment-feed
    name: Moment 列表
    description: Friend、Find 圈子和 Room members 中展示悬浮发布入口
    knownStates:
      - 默认浏览
      - 滚动中
      - 新圈子入口红点
      - 发布失败提示
    sourceRefs:
      - PRD 方案 / Moment 调整内容
      - Figma 363:12130
  - id: my-moment
    name: My Moment
    description: 用户自己的动态列表，新增不预选圈子的悬浮发布入口
    knownStates:
      - 有动态
      - 空状态
    sourceRefs:
      - PRD 方案 / My moment
      - Figma 1082:10643
  - id: feed-compose
    name: 动态发布器
    description: 支持文案、图片、圈子与可见范围；圈子配图规则由后端判断
    knownStates:
      - 空草稿
      - 已输入文案
      - 已选图片
      - 已选圈子
      - 新圈子红点
      - 提交中
      - 服务端校验失败
      - 恢复失败草稿
    sourceRefs:
      - PRD 发布器优化
      - Figma 1808:12355
  - id: feed-detail
    name: 动态详情
    description: 作者信息吸顶、互动操作吸底，正文与评论区独立滚动
    knownStates:
      - 他人动态未添加
      - 他人动态已添加
      - 自己的动态
      - 开放关系大区
      - ME 或 KSA
      - 图片加载中
      - 无评论
      - 已点赞
      - 评论输入激活
    sourceRefs:
      - PRD 动态详情页优化
      - Figma 363:11264

flows:
  - name: 从 Moment 发布
    type: primary
    steps:
      - 浏览 Friend、Find 圈子或 Room members
      - 点击右下角悬浮发布按钮
      - 进入现有发布器
      - 编辑内容并发布
      - 返回对应 Moment 列表
  - name: 从 My Moment 发布
    type: primary
    steps:
      - 浏览 My Moment
      - 点击右下角悬浮发布按钮
      - 进入发布器且不预选圈子
      - 编辑并发布
  - name: 发布纯文案圈子内容
    type: primary
    steps:
      - 输入纯文本并选择圈子
      - 客户端不拦截缺少图片
      - 提交服务端判断该圈子是否允许纯文案
      - 允许则发布成功
  - name: 服务端拒绝并恢复草稿
    type: error
    steps:
      - 服务端判定当前圈子仍要求配图
      - 展示发布失败控件与原因
      - 点击失败控件
      - 返回发布器并恢复失败草稿
  - name: 动态详情互动
    type: primary
    steps:
      - 进入动态详情
      - 作者栏固定在顶部，互动栏固定在底部
      - 点赞直接切换状态
      - 点击评论输入框或评论按钮唤起键盘
      - 开放关系大区且非本人时可点击 Chat 进入私聊
  - name: 消费新圈子红点
    type: secondary
    steps:
      - 后端按大区上线新圈子
      - 发布器圈子入口显示红点
      - 打开圈子选择面板后入口红点消失
      - 新圈子选项保留红点至本次面板关闭
      - 下次打开面板时选项红点消失

rules:
  - text: Friend、Find 各圈子、Room members 都必须提供悬浮发布入口
    source: PRD Moment 调整内容
    confidence: high
  - text: My Moment 进入发布器时不预选任何圈子
    source: PRD My moment
    confidence: high
  - text: 客户端取消圈子内容必须配图的校验，由后端统一判断
    source: PRD 发布器优化
    confidence: high
  - text: 新圈子入口红点在打开选择面板后消失，选项红点在下次打开面板时消失
    source: PRD 后端可指定大区上线新圈子
    confidence: high
  - text: 动态详情 title 区固定顶部，互动区固定底部
    source: PRD 动态详情页优化
    confidence: high
  - text: 已添加或自己的动态隐藏添加按钮
    source: PRD 动态详情 title 区
    confidence: high
  - text: ME、KSA 不展示 Chat；自己的动态也不展示 Chat
    source: PRD 动态详情互动区
    confidence: high
  - text: Chat 隐藏后评论输入框自适应占用剩余宽度
    source: PRD 动态详情互动区
    confidence: high

