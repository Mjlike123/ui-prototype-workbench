conflicts: []

openQuestions:
  - 取消 Moment 礼包悬浮入口后，礼包是否迁移到其他入口？
  - 发布失败恢复草稿是否必须恢复文案、图片、圈子、可见范围和输入焦点？
  - 服务端拒绝纯文案时的错误码与面向用户的正式文案是什么？
  - 新圈子红点是否跨设备同步；入口和选项红点的消费状态由前端还是后端保存？
  - 旧版本兼容章节为空：旧版客户端是否收到新圈子及纯文案圈子配置？
  - 数据埋点章节为空：发布 FAB 曝光/点击、发布来源、恢复草稿、底部互动点击是否需要新增事件？
  - 加好友按钮仅写“UI 调整”，是否完全采用 Figma 视觉与现有点击逻辑？
  - 动态详情图片加载失败、内容删除、无权限和网络错误是否纳入本期？
