schemaVersion: 1
feature:
  id: group-message-pin
  name: 群消息置顶
  platform: ios
  viewport:
    width: 375
    height: 812
  goal: 让群成员快速查看重要消息，并让有权限的成员在当前会话内完成置顶与移除。

source:
  type: figma
  ref: https://www.figma.com/design/JbG9tc63Ro1d4OrMTdNcbK/V3.30.0?node-id=18-813
  extractedAt: 2026-11-10

scope:
  included:
    - 单条置顶消息
    - 多条置顶消息的收起与展开
    - 长按消息后执行置顶
    - 有权限成员从置顶列表移除消息
    - 点击置顶消息后定位并高亮原消息
    - 原消息已删除或超出可定位范围时的降级详情
  excluded:
    - 删除原消息
    - 修改群成员权限
    - 置顶消息跨群同步

rules:
  - 置顶和取消置顶只改变置顶列表，不改变原消息内容。
  - 多条置顶按置顶时间倒序展示，收起态展示第一条摘要。
  - 点击置顶摘要优先定位原消息，并使用短时非颜色高亮反馈。
  - 原消息不可定位时保留可读详情并解释原因，不能进入空白页。
  - 移除置顶是可逆整理操作，不使用删除危险色，也不删除原消息。
  - 页面使用 375 × 812；左右基础间距 16，间距遵循 4pt 网格。
  - 导航背景绑定 背景色/bgPrimary。
  - KU 业务强调色绑定 KU主色/brandPrimary，不使用通用青色品牌值。
  - 图标复用 TopTop 图标组件或现有 Figma 组件实例。

openQuestions:
  - 最终可置顶角色由后端权限矩阵确认；原型统一称为“有权限成员”。
  - 置顶数量上限与超限反馈待产品和服务端确认。
  - 支持置顶的消息类型范围待确认；原型覆盖文本、图片和互动消息摘要。
