description: 用于触发即时操作的实体按钮，包含 48、40、32、24 四档高度，以及默认、禁用和按下三种状态。
previewKey: button
reference:
  figmaUrl: https://www.figma.com/design/tyYEbtAXWTxSLduue3ixgp/TOP-UI-kit?node-id=40-3514
  nodeId: "40:3514"
  observations:
    - 按钮按高度分为 48、40、32、24 四档，圆角均为高度的一半
    - 48px 大按钮用于页面底部主操作；375px 屏宽下左右边距各 16px，内容宽 343px
    - 中间弹窗双按钮保持 16px 间距；半窗双按钮使用 15px 间距，在左右 16px 页面边距内等分可用宽度
    - 半窗双按钮案例使用 48px 按钮和 164px 单按钮宽度，左侧为中性灰辅助操作，右侧为主题色主操作
    - 40px 中按钮主要用于弹窗和局部操作，可按容器宽度自适应
    - 32px 小按钮用于列表与小场景，按文字内容自适应宽度，水平内边距 16px
    - 24px Mini 按钮用于紧凑列表和小场景，按文字内容自适应宽度，水平内边距 12px
    - 48px 与 40px 文案使用 SF Pro Semibold 16px；32px 使用 Regular 14px；24px 使用 Regular 12px
    - 每种视觉类型必须提供默认、禁用、按下三种状态
    - 支持主题色、主题浅色、中性灰、15%透明底色、主色描边和中性灰描边
    - 主题浅色禁用态使用 10% 主色背景和 #8AECE3 文字；按下态使用 #8AECE3 背景和 #12ADA0 文字
    - 中性灰可点击态使用 color.button.primary 背景和 color.text.secondary 文字
    - 多语言极限情况下文字与边框至少保留 4px，但 32px 与 24px 按钮优先扩宽而非折行
anatomy:
  - id: container
    label: 按钮容器
    description: 承载背景、描边、圆角和完整点击区域，圆角为按钮高度的 50%。
  - id: label
    label: 按钮文案
    description: 使用动词或动宾短语，单行水平居中，不以缩小字号容纳长文案。
variants:
  - name: size
    values:
      - height48
      - height40
      - height32
      - height24
    defaultValue: height48
  - name: appearance
    values:
      - primary
      - primary-soft
      - neutral
      - translucent
      - primary-outline
      - neutral-outline
    defaultValue: primary
  - name: state
    values:
      - default
      - disabled
      - pressed
    defaultValue: default
  - name: widthBehavior
    values:
      - fluid
      - hug
    defaultValue: fluid
props:
  - name: label
    type: string
    required: true
    description: 简短、明确的操作文案；32px 与 24px 按钮保持单行。
  - name: size
    type: height48|height40|height32|height24
    defaultValue: height48
    description: 控制按钮高度、字号、字重、圆角和水平内边距。
  - name: appearance
    type: primary|primary-soft|neutral|translucent|primary-outline|neutral-outline
    defaultValue: primary
    description: 根据操作优先级和所在背景选择视觉类型。
  - name: disabled
    type: boolean
    defaultValue: false
    description: 禁止交互并提供平台原生禁用语义。
  - name: fullWidth
    type: boolean
    defaultValue: true
    description: 48px 与页面主操作通常填满容器；32px、24px 默认按内容自适应。
  - name: onPress
    type: () => void
    required: true
    description: 完成一次有效点击或键盘激活后触发。
