accessibility:
  - 使用平台原生按钮语义；Web 必须渲染 button，不使用可点击 div。
  - 禁用态同时设置 disabled 或等价平台属性，不能只降低透明度。
  - 按下态由真实按压、键盘 Space/Enter 或平台状态驱动，不作为持久选中态。
  - 24px 是视觉高度；移动端应通过外围布局保证至少 44×44pt 的可触达区域。
  - 文案保持可读对比度，禁用态也不能完全不可见。
