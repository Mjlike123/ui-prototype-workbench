accessibility:
  - 消息列表项语义由调用方提供；组件根节点通过 group 和收发方向描述内容类别。
  - 图片必须提供能描述内容或目的的 mediaAlt；装饰图才允许空替代文本。
  - 语音播放使用原生按钮并通过 aria-pressed 暴露播放状态；未播放状态同时提供可访问名称。
  - 发送中和发送失败使用 role=status 与明确文本，不仅使用旋转图标或红点。
  - 卡片操作的 disabled、loading 和 expired 状态不可重复触发；禁用原因由业务层提供。
  - 所有可点击内容使用 focus-visible 2pt 焦点环，动效遵循 prefers-reduced-motion。
