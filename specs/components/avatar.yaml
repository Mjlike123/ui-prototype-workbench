props:
  - name: src
    type: string
    required: true
    description: 用户头像资源地址。
  - name: alt
    type: string
    required: true
    description: 头像独立表达身份时提供用户名称；纯装饰或默认空状态时传空字符串。
  - name: empty
    type: boolean
    defaultValue: false
    description: 无用户头像时使用默认空状态切图，替代真实用户图片。
  - name: emptyTheme
    type: light|dark
    defaultValue: light
    description: 默认空状态的场景主题；亮色页面用 light，暗色页面用 dark。
  - name: size
    type: 72|60|48|40|36|24|20
    defaultValue: 48
    description: 按业务场景选择头像视觉尺寸。
  - name: frameSrc
    type: string
    description: 用户已获得且当前装备的头像框资源；不存在时不得保留空装饰占位。Kit gap：H5 参考实现当前使用固定示例资源，尚不支持按用户传入。
  - name: badgeSrc
    type: string
    description: 当前业务状态对应的徽标切图；不存在时不渲染徽标容器。Kit gap：H5 参考实现尚未支持。
