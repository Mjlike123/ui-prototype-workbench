accessibility:
  - 头像独立表达用户身份时，图片替代文本必须使用可识别的用户名称，不能写“头像图片”。
  - 头像与用户名同时出现且信息重复时，头像应使用空替代文本，避免辅助技术重复播报。
  - 头像框仅为装饰，必须对辅助技术隐藏；权益或身份含义由可读标签另行表达。
  - 状态徽标图片必须对辅助技术隐藏，并通过头像外部状态文本或控件可访问名称表达完整含义。
  - 点击头像时，视觉尺寸小于 44pt 的变体仍需由外层控件提供至少 44×44pt 的触达区域。
