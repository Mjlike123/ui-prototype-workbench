description: 用于展示用户身份的圆形图片组件，覆盖 20–72pt 业务尺寸，并支持在明确的身份权益场景叠加装饰头像框。
previewKey: avatar
reference:
  figmaUrl: https://www.figma.com/design/tyYEbtAXWTxSLduue3ixgp/TOP-UI-kit?node-id=3035-22528
  nodeId: "3035:22528"
  observations:
    - 头像业务尺寸包括 72、60、48、40、36、24、20pt，均保持 1:1 圆形裁切
    - 72pt 用于 Profile 与 mini card 大头像；60pt 用于亲密关系、权益页面大头像
    - 48pt 用于大部分列表和语音房；40pt 用于亲密关系头像；36pt 用于首页 Me 入口
    - 24pt 用于紧凑列表；20pt 仅用于弱化展示，不承担主要身份识别
    - 无头像框时图片边缘使用 10% 一级文字色描边，避免浅色头像与背景粘连
    - 头像框属于用户已获得或已装备的身份装饰，仅用于 Profile、mini card、亲密关系、权益、语音房和明确支持装扮的用户列表
    - 系统通知、普通操作列表、匿名或默认头像、非用户实体不得使用头像框
    - 头像框必须覆盖在头像外层且保持头像中心不变；装饰可以超出头像尺寸，但不得改变相邻文字的对齐起点
    - 头像右下角可叠加男女、选中、闭麦、贵族、在线或游戏徽标；徽标使用独立切图资源，不由 CSS 临摹图形
    - 徽标属于瞬时状态或身份补充，不替代可读的在线、静音、性别或权益文本
    - 无用户头像时使用默认空状态切图；亮色场景为浅灰底 + 成员剪影，暗色场景为 10% 白色底 + 10% 白色剪影，按页面背景选择
anatomy:
  - id: container
    label: 头像容器
    description: 维持正方形尺寸、圆形裁切和稳定的布局占位。
  - id: avatarImage
    label: 头像图片
    description: 使用 cover 裁切填满圆形区域，并提供替代文本或由外部可访问名称描述用户身份。
  - id: decorationFrame
    label: 装饰头像框
    description: 可选权益装饰层，位于头像上方并围绕头像中心等比缩放，不参与图片裁切。
  - id: statusBadge
    label: 状态徽标
    description: 可选切图层，固定在头像右下角，用于补充性别、选中、闭麦、贵族、在线或游戏状态。Kit gap：H5 参考实现尚未提供该层，业务需要时先按原型模块处理。
