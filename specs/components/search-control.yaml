  - field
  - searchIcon
  - input
  - clearButton
  - cancelAction
rules:
  - id: container.height
    title: 输入态整体高度
    category: structure
    metric: height
    tolerance: 1
    aggregate: rule
  - id: field.height
    title: 搜索框视觉高度
    category: structure
    metric: height
    tolerance: 1
    aggregate: rule
  - id: field.horizontalPadding
    title: 搜索框水平内边距
    category: spacing
    metric: horizontalPadding
    tolerance: 1
    aggregate: rule
  - id: field.gap
    title: 搜索框内部元素间距
    category: spacing
    metric: gap
    tolerance: 1
    aggregate: rule
  - id: active.textColor
    title: 输入态文字颜色
    category: selected
    metric: textColor
    state: selected
    tolerance: 12
    aggregate: rule
  - id: idle.textColor
    title: 占位态文字颜色
    category: unselected
    metric: textColor
    state: unselected
    tolerance: 12
    aggregate: rule
  - id: field.backgroundColor
    title: 搜索框背景色
    category: structure
    metric: backgroundColor
    tolerance: 12
    aggregate: rule
