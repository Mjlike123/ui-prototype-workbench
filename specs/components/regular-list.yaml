accessibility:
  - 交互列表项使用平台原生按钮、链接或列表项语义，完整行提供至少 44pt 高的点击区域。
  - 标题、副文案、标签和未读状态按视觉顺序合并为可理解的可访问名称，不逐个朗读纯装饰勋章。
  - 尾部独立按钮必须有明确名称并阻止事件冒泡，不能同时触发列表项跳转。
  - 未读状态不能只依赖红色；辅助技术应读取未读数量或未读说明。
  - 文案视觉省略时仍保留完整可访问文本，头像与头像框只暴露一次用户身份描述。
